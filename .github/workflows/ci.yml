name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in engines; 26 is current. CI is the only
        # place that claim is actually tested.
        node: ['22', '26']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts because prepare links against a harness home that a
      # runner does not have. Every peer is also a devDependency, so a clean
      # checkout builds and tests from node_modules alone.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # The suite includes real-composition tests: they mount the built plugin
      # through the Cordis loader beside the genuine harness services these
      # dependencies provide. A green run means the tools registered and
      # executed through the real pipeline, not merely that the types lined up.
      - name: Test
        run: npm test

      # A registry install never runs a build, so a tarball without lib/ would
      # install cleanly and then fail to load. This is the check that catches it.
      #
      # It reads a real tarball with tar rather than parsing npm's --json report:
      # that report's shape is not a stable interface across npm majors, and a
      # parser that silently reads no files reports a missing lib/ that is
      # actually there. It also prints the contents, so a failure here explains
      # itself without needing anyone to read the log.
      - name: Pack sanity check
        run: |
          if ! npm pack --pack-destination "${{ runner.temp }}" > "${{ runner.temp }}/pack.out" 2>&1; then
            echo "::error::npm pack failed"
            cat "${{ runner.temp }}/pack.out"
            exit 1
          fi
          tarball=$(find "${{ runner.temp }}" -maxdepth 1 -name '*.tgz' | head -1)
          echo "packed: $tarball"
          tar -tzf "$tarball" | sed 's|^package/||' | sort > "${{ runner.temp }}/contents.txt"
          echo "tarball contents ($(wc -l < "${{ runner.temp }}/contents.txt") entries):"
          cat "${{ runner.temp }}/contents.txt"

          status=0
          for required in lib/index.js lib/tools.js cordis.patch.yml package.json LICENSE; do
            if ! grep -qx "$required" "${{ runner.temp }}/contents.txt"; then
              echo "::error::$required is missing from the tarball"
              status=1
            fi
          done
          [ "$status" -eq 0 ] || exit 1
          echo "ok: every required file is in the tarball"

  # Publishing is deliberately not automated here. It needs a release decision
  # and an NPM_TOKEN secret; until then it stays a deliberate local command,
  # which also keeps npm provenance out of the picture.
